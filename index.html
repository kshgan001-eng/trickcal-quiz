function giveup(){if(finished)return;dialog('도전을 끝낼까요?','남은 정답이 공개됩니다.',[['취소','',close],['정답 공개','warn',()=>{close();end(true)}]])}
function end(lost){finished=true;gaveUp=lost;stop();cells.forEach((_,id)=>refreshCell(id));update();dialog(lost?'도전 종료':'도감 완성',lost?'결과를 확인하세요.':'전부 맞혔어요!',[['결과 복사','',copy],['다시 하기','main',reset],['닫기','',close]],true)}
async function copy(){const msg=`트릭컬 사도 맞추기\n${found.size}/${APOSTLES.length}명 · ${clock(seconds)} · 힌트 ${hintsUsed}회`;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(msg);else{const t=document.createElement('textarea');t.value=msg;document.body.append(t);t.select();document.execCommand('copy');t.remove()}toast('결과를 복사했어요')}catch(e){toast('복사할 수 없어요',true)}}
function reset(){if(!finished&&!confirm('처음부터 다시 시작할까요?'))return;stop();found.clear();hinted.clear();seconds=0;started=false;finished=false;gaveUp=false;hintsUsed=0;filter='all';cells.forEach((_,id)=>refreshCell(id));close();update();window.scrollTo({top:0,behavior:'smooth'})}
$('form').addEventListener('submit',e=>{e.preventDefault();send()});$('hintBtn').addEventListener('click',hint);$('giveupBtn').addEventListener('click',giveup);$('sound').addEventListener('click',()=>{soundOn=!soundOn;update()});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;update()}));$('shade').addEventListener('click',e=>{if(e.target===$('shade'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('shade').hidden)close()});document.addEventListener('visibilitychange',()=>{if(document.hidden){stop()}else if(started&&!finished)start()});
build();
</script></body></html>
